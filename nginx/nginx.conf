# ── nginx/nginx.conf ──────────────────────────────────────────────────────────
#
# Traffic routing:
#   /api/v1/market/*  →  FastAPI  (Python scraper-fed data)
#   /api/*            →  Node.js  (existing backend, untouched)
#   /*                →  Node.js  (catch-all: static assets, SSR, etc.)
#
# TLS termination is handled here; both upstreams speak plain HTTP internally.
# ─────────────────────────────────────────────────────────────────────────────

upstream fastapi_backend {
    server fastapi:8000;
    keepalive 32;
}

upstream node_backend {
    server node:3000;
    keepalive 32;
}

# ── rate limiting ──────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # SSL — replace with real cert paths (or use Certbot / Let's Encrypt)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── FastAPI routes (scraper-fed market data) ───────────────────────────────
    location /api/v1/market/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # FastAPI health probe (internal use / uptime monitoring)
    location /health {
        proxy_pass         http://fastapi_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Node.js routes (all other API paths + catch-all) ──────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass         http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # ── static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass         http://node_backend;
        expires            7d;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}
