version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Services
#   postgres  — primary data store
#   redis     — cache layer (FastAPI reads, 30 s TTL)
#   fastapi   — Market Data API  (port 8000, internal)
#   scheduler — scraper daemon   (no exposed port)
#   nginx     — reverse proxy    (ports 80 / 443, public)
#   node      — existing Node.js backend (port 3000, internal)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-postgres}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ── FastAPI ──────────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL:        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL:           redis://redis:6379/0
      FRONTEND_URL:        ${FRONTEND_URL:-*}
      CACHE_TTL_SECONDS:   ${CACHE_TTL_SECONDS:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  # ── Scheduler (scraper daemon) ───────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-postgres}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCRAPER_MIN_INTERVAL:   ${SCRAPER_MIN_INTERVAL:-30}
      SCRAPER_MAX_INTERVAL:   ${SCRAPER_MAX_INTERVAL:-60}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # ── Node.js backend (existing — mount your own source) ───────────────────────
  node:
    image: node:20-alpine          # replace with your own build if needed
    restart: unless-stopped
    working_dir: /app
    # volumes:
    #   - ../your-node-app:/app    # uncomment and point at your Node source
    # command: node server.js      # or: npm start, yarn start, etc.
    environment:
      NODE_ENV: production
      PORT:     3000
    networks:
      - backend

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro      # mount your TLS certs here
    depends_on:
      - fastapi
      - node
    networks:
      - backend

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
